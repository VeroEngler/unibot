services:
  unibot:
    build: .
    container_name: unibot-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SYNC_COMMANDS=${SYNC_COMMANDS:-0}
    volumes:
      - ./MATERIAS.txt:/app/MATERIAS.txt:ro
      - ./TAGS_OPINIONS.txt:/app/TAGS_OPINIONS.txt:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"