name: CI/CD Unibot

# This workflow runs linting, unit tests, and deploys the bot to the production server on push events to the main branch.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint (PEP 8)
        run: flake8 . --exclude=.venv,venv --max-line-length=100

      - name: Run unit tests
        run: python -m pytest tests/ -v


